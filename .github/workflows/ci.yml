---
name: ci

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ci-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

permissions: {}

jobs:
  prechecks:
    uses: ./.github/workflows/pre-commit.yml
  all-prechecks:
    needs: [prechecks]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      core_repository: ${{ steps.core.outputs.repository }}
      core_ref: ${{ steps.core.outputs.ref }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Resolve the sst-core to build against
        id: core
        run: |
          # .github/sst-core-ref ("<owner/repo> <ref>") pins the core for a
          # branch that needs an unreleased core; without it, upstream devel.
          repository=sstsimulator/sst-core
          ref=devel
          if [ -f .github/sst-core-ref ]; then
            read -r repository ref < .github/sst-core-ref
          fi
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
      - name: Success
        run: "true"
  tests:
    needs: [all-prechecks]
    uses: ./.github/workflows/build_and_test.yml
    with:
      core_ref: ${{ needs.all-prechecks.outputs.core_ref }}
      core_repository: ${{ needs.all-prechecks.outputs.core_repository }}
    permissions:
      actions: write
  all-tests:
    needs: [tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Success
        run: "true"
